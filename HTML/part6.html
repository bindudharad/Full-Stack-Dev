<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Part 6 - Table Tags</title>
</head>
<body>

    <h2>HTML Table Example</h2>

    <table border="1">
        <caption>Student Details</caption>

        <colgroup>
            <col style="background-color: #f2f2f2;">
            <col style="background-color: #e6f7ff;">
        </colgroup>

        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Bindu</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Vishwa</td>
                <td>21</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total Students</td>
                <td>2</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
