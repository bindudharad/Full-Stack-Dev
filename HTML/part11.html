<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Part 11 - Deprecated & Obsolete Tags</title>
</head>
<body>

    <!-- FONT TAG (Deprecated) -->
    <font color="red" size="5">This is font tag (Deprecated)</font>
    <br><br>

    <!-- CENTER TAG (Deprecated) -->
    <center>This text is centered using center tag</center>
    <br><br>

    <!-- BIG TAG (Deprecated) -->
    <big>This is big tag text</big>
    <br><br>

    <!-- STRIKE TAG (Deprecated) -->
    <strike>₹1000</strike>
    <br><br>

    <!-- TT TAG (Deprecated) -->
    <tt>console.log("Hello")</tt>
    <br><br>

    <!-- ACRONYM TAG (Deprecated) -->
    <acronym title="World Health Organization">WHO</acronym>
    <br><br>

    <!-- FRAMESET & FRAME (Obsolete – will not work in HTML5 properly) -->
    <!-- Example shown only for knowledge -->

    <!--
    <frameset cols="50%,50%">
        <frame src="page1.html">
        <frame src="page2.html">
    </frameset>
    -->

    <!-- NOFRAMES TAG (Deprecated) -->
    <!--
    <noframes>
        Your browser does not support frames.
    </noframes>
    -->

</body>
</html>
